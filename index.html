<!-- HƏQİQİ MÜSTƏQİL VEB-SAYT YARADAN MODUL (Səhifənə qətiyyən toxunmur) -->
<div style="max-width: 800px; margin: 40px auto; padding: 30px; background: #111827; border: 2px solid #2563eb; border-radius: 12px; box-shadow: 0 8px 25px rgba(37,99,235,0.3); font-family: Arial, sans-serif; color: #ffffff;">
    <h2 style="color: #60a5fa; text-align: center; margin-bottom: 10px;">H&H Həqiqi Veb-Sayt Qurucusu</h2>
    <p style="color: #9ca3af; text-align: center; font-size: 14px; margin-bottom: 25px;">Məlumatları daxil edin, başqa heç bir qarışıqlığı olmayan, tamamilə müstəqil və təmiz veb-sayt yaradın!</p>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Saytın Başlığı:</label>
        <input type="text" id="real-custom-title" placeholder="Məsələn: Mənim Şəxsi Bloqum" style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Saytın Mətni / Məzmunu:</label>
        <textarea id="real-custom-text" rows="4" placeholder="Saytda görünəcək əsas mətn..." style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;"></textarea>
    </div>

    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Şəkil Linki (URL):</label>
        <input type="text" id="real-custom-img" placeholder="https://example.com/image.jpg" style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;">
    </div>

    <button onclick="createAndOpenRealSite()" style="width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(37,99,235,0.4);">Həqiqi Sayt Yaradıb Yeni Pəncərədə Aç</button>
</div>

<script>
function createAndOpenRealSite() {
    const title = document.getElementById('real-custom-title').value || "Şəxsi Sayt";
    const text = document.getElementById('real-custom-text').value || "";
    const img = document.getElementById('real-custom-img').value || "";

    // Tamamilə müstəqil, təmiz veb-sayt kodu
    const htmlContent = `<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 650px; width: 100%; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-top: 0; font-size: 32px; }
        img { max-width: 100%; max-height: 350px; border-radius: 10px; margin: 20px 0; object-fit: cover; border: 1px solid #475569; }
        p { line-height: 1.7; color: #cbd5e1; font-size: 16px; white-space: pre-wrap; text-align: left; background: #0f172a; padding: 20px; border-radius: 8px; }
        .footer { margin-top: 30px; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>${title}</h1>
        ${img ? `<img src="${img}" alt="Sayt Şəkli">` : ''}
        <p>${text}</p>
        <div class="footer">Bu veb-sayt H&H platforması vasitəsilə müstəqil olaraq yaradılmışdır.</div>
    </div>
</body>
</html>`;

    // Bu kodu brauzerdə təmiz veb-sayt faylına çevirib dərhal yeni səhifədə açırıq
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    // Yeni pəncərədə açır ki, kənar heç bir sənin səhifənin izi qalmasın
    window.open(url, '_blank');
}
</script>
