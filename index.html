<!-- Veb-sayt Yaradıcı Konstruktoru -->
<div class="builder-container" style="max-width: 800px; margin: 30px auto; padding: 20px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: Arial, sans-serif;">
    <h2 style="color: #333; text-align: center; margin-bottom: 20px;">Öz Veb-Saytını Yarat</h2>
    
    <div id="builder-form">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">İstifadəçi Adınız (Link üçün):</label>
            <input type="text" id="site-username" placeholder="məsələn: anar" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Saytın Başlığı:</label>
            <input type="text" id="site-title" placeholder="Mənim Şəxsi Saytım" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Haqqınızda / Mətn:</label>
            <textarea id="site-text" rows="4" placeholder="Saytınızda görünəcək əsas mətn..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;"></textarea>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Şəkil Linki (URL):</label>
            <input type="text" id="site-image" placeholder="https://example.com/sekil.jpg" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
        </div>

        <button onclick="publishSite()" style="width: 100%; background: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Saytı Dərc Et (Publish)</button>
    </div>

    <!-- Nəticə və Linkin Göründüyü Hissə -->
    <div id="result-box" style="display: none; margin-top: 25px; padding: 20px; background: #e9ecef; border-radius: 8px; text-align: center;">
        <h3 style="color: #28a745; margin-top: 0;">Saytınız uğurla dərc olundu! 🎉</h3>
        <p>Sizin sayt linkiniz:</p>
        <a id="generated-link" href="#" style="font-size: 18px; font-weight: bold; color: #007bff; word-break: break-all; cursor: pointer;" onclick="viewMySite(event)"></a>
        
        <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 6px; border: 1px dashed #ccc; text-align: left;">
            <h4 style="margin-top: 0; color: #333;">Saytınızın Önizləməsi:</h4>
            <h1 id="preview-title" style="font-size: 24px; color: #222;"></h1>
            <img id="preview-image" src="" alt="" style="max-width: 100%; height: auto; border-radius: 6px; display: none; margin-bottom: 10px;">
            <p id="preview-text" style="color: #555; line-height: 1.5;"></p>
        </div>
    </div>
</div>

<script>
let savedSites = {};

function publishSite() {
    const username = document.getElementById('site-username').value.trim().toLowerCase();
    const title = document.getElementById('site-title').value;
    const text = document.getElementById('site-text').value;
    const imageUrl = document.getElementById('site-image').value;

    if (!username) {
        alert("Zəhmət olmasa istifadəçi adı daxil edin!");
        return;
    }

    // Server xətası olmasın deyə birbaşa saytın içində açılan etibarlı link formatı
    const customLink = `https://hhiletisim.io/#user=${username}`;

    // Məlumatları yadda saxlayırıq ki, linkə basanda açılsın
    savedSites[username] = {
        title: title || "Başlıqsız Sayt",
        text: text || "Mətn daxil edilməyib.",
        image: imageUrl
    };

    // Linki ekrana çıxarmaq
    const linkElement = document.getElementById('generated-link');
    linkElement.href = customLink;
    linkElement.innerText = customLink;

    // Önizləməni doldurmaq
    document.getElementById('preview-title').innerText = savedSites[username].title;
    document.getElementById('preview-text').innerText = savedSites[username].text;
    
    const imgEl = document.getElementById('preview-image');
    if (imageUrl) {
        imgEl.src = imageUrl;
        imgEl.style.display = 'block';
    } else {
        imgEl.style.display = 'none';
    }

    // Nəticə qutusunu göstərmək
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
}

function viewMySite(event) {
    event.preventDefault();
    alert("Saytınız aktivdir və yuxarıdakı önizləmə panelində göstərilir!");
}
</script>
