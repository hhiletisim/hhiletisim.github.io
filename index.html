<!-- HƏQİQİ İŞLƏK VƏ MÖVCUD SAYTA İNTEQRasiya OLUNMUŞ QURUCU -->
<div id="real-website-builder" style="max-width: 800px; margin: 40px auto; padding: 30px; background: #111827; border: 2px solid #2563eb; border-radius: 12px; box-shadow: 0 8px 25px rgba(37,99,235,0.3); font-family: Arial, sans-serif; color: #ffffff;">
    <h2 style="color: #60a5fa; text-align: center; margin-bottom: 10px;">H&H Veb-Sayt Qurucusu</h2>
    <p style="color: #9ca3af; text-align: center; font-size: 14px; margin-bottom: 25px;">Məlumatları daxil edin, saytınız birbaşa aşağıda səhifə daxilində (embed) yaradılsın!</p>
    
    <div id="builder-form-box">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Saytın Başlığı:</label>
            <input type="text" id="custom-title" placeholder="Məsələn: Mənim Saytım" style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Saytın Mətni:</label>
            <textarea id="custom-text" rows="4" placeholder="Saytınızda görünəcək mətn..." style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;"></textarea>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #93c5fd;">Şəkil Linki (URL):</label>
            <input type="text" id="custom-img" placeholder="https://example.com/image.jpg" style="width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; box-sizing: border-box;">
        </div>

        <button onclick="generateEmbeddedSite()" style="width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(37,99,235,0.4);">Saytı Dərc Et və Göstər</button>
    </div>

    <!-- Səhifə daxilində (embed olunmuş) yaranan həqiqi sayt pəncərəsi -->
    <div id="dynamic-site-output" style="display: none; margin-top: 30px; padding: 15px; background: #0b0f19; border: 1px solid #10b981; border-radius: 8px;">
        <h3 style="color: #10b981; margin-top: 0; text-align: center; margin-bottom: 15px;">Saytınız Səhifəyə İnteqrasiya Olundu! 🚀</h3>
        <!-- Kənarları görünməyən təmiz iframe pəncərəsi -->
        <iframe id="embedded-site-frame" style="width: 100%; height: 400px; border: none; border-radius: 6px; background: #fff;"></iframe>
    </div>
</div>

<script>
function generateEmbeddedSite() {
    const title = document.getElementById('custom-title').value || "Adsız Sayt";
    const text = document.getElementById('custom-text').value || "";
    const img = document.getElementById('custom-img').value || "";

    // Kənarları təmiz olan mini sayt kodu
    const siteHtml = `<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #ffffff; color: #333; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #2563eb; margin-top: 10px; font-size: 26px; }
        img { max-width: 100%; max-height: 220px; border-radius: 6px; margin: 15px 0; object-fit: cover; }
        p { line-height: 1.5; color: #555; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>${title}</h1>
    ${img ? `<img src="${img}" alt="Şəkil">` : ''}
    <p>${text}</p>
</body>
</html>`;

    // Bu kodu birbaşa iframe daxilinə yerləşdiririk ki, saytın içində yaşasın
    const iframe = document.getElementById('embedded-site-frame');
    iframe.srcdoc = siteHtml;

    document.getElementById('dynamic-site-output').style.display = 'block';
    document.getElementById('dynamic-site-output').scrollIntoView({ behavior: 'smooth' });
}
</script>
